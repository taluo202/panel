<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link rel="icon" type="image/svg+xml" href="img/logo.svg"/>
<title>Giriş Yap — Kurumsal Panel</title>
<link rel="stylesheet" href="css/tailwind.css"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
  body{font-family:'Inter',sans-serif}
  .material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
  .bg-pattern{background-image:radial-gradient(circle at 20% 50%,#dce1ff 0%,transparent 50%),radial-gradient(circle at 80% 20%,#b6c4ff 0%,transparent 40%)}
</style>
</head>
<body class="min-h-screen bg-surface bg-pattern flex items-center justify-center p-4">

<div class="w-full max-w-sm">

  <div class="text-center mb-8">
    <div class="inline-flex items-center justify-center mb-4">
      <img src="img/logo.svg" alt="" class="firma-logo h-20 w-auto drop-shadow-xl"/>
    </div>
    <h1 class="text-2xl font-extrabold text-on-surface font-headline">Taloo</h1>
    <p class="text-sm text-slate-500 mt-1">Varlık & Personel Yönetimi</p>
  </div>

  <div class="bg-white rounded-2xl shadow-xl p-8">
    <h2 class="text-lg font-bold text-on-surface font-headline mb-6">Oturum Açın</h2>

    <div id="donusUyari" class="hidden mb-4 p-3 bg-surface-container-low rounded-xl flex items-center gap-2 text-sm text-on-surface font-medium">
      <span class="material-symbols-outlined text-base text-primary">info</span>
      <span id="donusUyariMetin"></span>
    </div>

    <div id="errorBox" class="hidden mb-4 p-3 bg-error-container rounded-xl flex items-center gap-2 text-sm text-error font-medium">
      <span class="material-symbols-outlined text-base">error</span>
      <span id="errorMsg"></span>
    </div>

    <form id="loginForm" class="space-y-4" autocomplete="on" novalidate>
      <div class="space-y-1.5">
        <label class="text-[11px] font-bold text-slate-500 uppercase tracking-wider block" for="username">Kullanıcı Adı</label>
        <input id="username" name="username" type="text" autocomplete="username" required
          class="w-full bg-surface-container-low border-none rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-primary/30 transition outline-none"
          placeholder="admin"/>
      </div>
      <div class="space-y-1.5">
        <label class="text-[11px] font-bold text-slate-500 uppercase tracking-wider block" for="password">Şifre</label>
        <div class="relative">
          <input id="password" name="password" type="password" autocomplete="current-password" required
            class="w-full bg-surface-container-low border-none rounded-xl px-4 py-3 pr-11 text-sm focus:ring-2 focus:ring-primary/30 transition outline-none"
            placeholder="••••••••"/>
          <button type="button" data-on-click="togglePw" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
            <span id="pwIcon" class="material-symbols-outlined text-lg">visibility</span>
          </button>
        </div>
        <div class="text-right">
          <a href="sifre-sifirla.html" class="giris-bag text-xs text-primary font-semibold hover:underline">Şifremi unuttum</a>
        </div>
      </div>

      <div id="kodAdim" class="hidden space-y-1.5">
        <div class="flex items-center gap-2 text-xs text-slate-500 bg-surface-container-low rounded-xl px-3 py-2">
          <span class="material-symbols-outlined text-base text-primary">phonelink_lock</span>
          <span>Doğrulama uygulamanızdaki 6 haneli kodu girin.</span>
        </div>
        <label class="text-[11px] font-bold text-slate-500 uppercase tracking-wider block" for="kod">Doğrulama Kodu</label>
        <input id="kod" name="kod" type="text" inputmode="numeric" autocomplete="one-time-code"
          maxlength="9" placeholder="000000"
          class="w-full bg-surface-container-low border-none rounded-xl px-4 py-3 text-center text-lg font-bold tracking-[0.4em] focus:ring-2 focus:ring-primary/30 transition outline-none"/>
        <p class="text-[11px] text-slate-400 leading-relaxed">
          Telefonunuza erişemiyorsanız kurtarma kodlarınızdan birini yazın (ör. A1B2-C3D4).
        </p>
      </div>

      <button type="submit" id="submitBtn"
        class="w-full py-3 bg-primary text-white font-bold rounded-xl text-sm shadow-sm hover:opacity-90 active:scale-95 transition flex items-center justify-center gap-2">
        <span class="material-symbols-outlined text-lg">login</span>
        <span id="submitText">Giriş Yap</span>
      </button>
    </form>
  </div>

</div>

<script src="js/eylem.js"></script>
<script src="js/s-login.js"></script>
<script src="js/pwa.js"></script>
</body>
</html>
