<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link rel="icon" type="image/svg+xml" href="img/logo.svg"/>
<title>QR Okut — Kurumsal Panel</title>
<link rel="stylesheet" href="css/tailwind.css"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
  .material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
  body{font-family:'Inter',sans-serif} h1,h2,h3{font-family:'Manrope',sans-serif}
  .qr-eylem{min-height:64px}
</style>
<link rel="stylesheet" href="css/belge.css"/>
</head>
<body class="bg-surface text-on-surface antialiased">

<div class="min-h-screen flex flex-col">
  <header class="bg-white border-b border-slate-100 px-4 py-3 flex items-center gap-3 sticky top-0 z-10">
    <img src="img/logo.svg" alt="" class="firma-logo h-8 w-auto order-first"/>
    <span class="text-sm font-black tracking-tight order-first mr-auto">QR Okut</span>
    <a href="index.html" id="qrPanelLink" class="hidden text-xs font-bold text-primary hover:underline order-last">Panel</a>
  </header>

  <main class="flex-1 p-4 max-w-lg w-full mx-auto">

    <div id="qrTarayici" class="hidden">
      <div class="bg-white rounded-2xl shadow-sm p-5 text-center">
        <span class="material-symbols-outlined text-5xl text-primary">qr_code_scanner</span>
        <h1 class="text-lg font-black mt-2">Makine ya da personel QR'ını okutun</h1>
        <p class="text-xs text-slate-400 mt-1 mb-4">Makinenin üzerindeki etiketi ya da personel rozetini kameraya gösterin.</p>
        <button id="qrBaslatBtn" data-on-click="qrTaramaBaslat"
          class="w-full py-3.5 bg-primary text-white font-bold rounded-xl text-sm hover:opacity-90 transition inline-flex items-center justify-center gap-2">
          <span class="material-symbols-outlined">photo_camera</span> Kamerayı Aç
        </button>
        <div id="qrReader" class="mt-4 rounded-xl overflow-hidden"></div>
        <p id="qrTaramaHata" class="hidden mt-3 text-xs text-error font-semibold"></p>
      </div>
    </div>

    <div id="qrKart" class="hidden"></div>

    <div id="qrYukleniyor" class="text-center py-16 text-slate-400 text-sm">Yükleniyor…</div>
    <div id="qrHata" class="hidden bg-error-container text-error rounded-2xl p-5 text-sm font-semibold text-center"></div>
  </main>
</div>

<script src="js/eylem.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js" integrity="sha384-c9d8RFSL+u3exBOJ4Yp3HUJXS4znl9f+z66d1y54ig+ea249SpqR+w1wyvXz/lk+" crossorigin="anonymous"></script>
<script src="js/theme-config.js"></script>
<script src="js/belge.js"></script>
<script src="js/app.js"></script>
<script src="js/referans-foto.js"></script>
<script src="js/s-qr.js"></script>
</body>
</html>
