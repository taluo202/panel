<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link rel="icon" type="image/svg+xml" href="img/logo.svg"/>
<title>Müşteri Portalı — Şifre Belirle</title>
<link rel="stylesheet" href="css/tailwind.css"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
  .material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
  body{font-family:'Inter',sans-serif} h1,h2,h3{font-family:'Manrope',sans-serif}
  .inp{width:100%;background:#eff4ff;border:none;border-radius:0.75rem;padding:0.65rem 0.9rem;font-size:0.9rem;outline:none}
  .inp:focus{box-shadow:0 0 0 2px #00236f33}
  .lbl{font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:4px}
  #bzil, #garama { display:none !important; }
</style>
<link rel="stylesheet" href="css/belge.css"/>
</head>
<body class="bg-surface text-on-surface antialiased">
<main class="min-h-screen flex flex-col">
  <header class="px-4 md:px-8 py-5 flex items-center gap-3">
    <img src="img/logo.svg" alt="" class="firma-logo h-9 w-auto"/>
    <h1 class="text-base font-bold text-blue-950 font-headline">Müşteri Portalı</h1>
  </header>
  <div class="flex-1 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-sm p-7 w-full max-w-sm">
      <div id="formAlan">
        <h2 class="text-lg font-bold font-headline mb-1">Şifre Belirle</h2>
        <p class="text-sm text-slate-500 mb-5">Portala giriş için bir şifre belirleyin.</p>
        <div class="space-y-4">
          <div><label class="lbl">Şifre</label><input id="dSifre" type="password" class="inp"/></div>
          <div><label class="lbl">Şifre (Tekrar)</label><input id="dSifre2" type="password" class="inp" data-on-keydown="kaydet" data-key="Enter"/></div>
          <p class="text-[11px] text-slate-400">En az 10 karakter; en az bir harf ve bir rakam.</p>
        </div>
        <button id="dBtn" data-on-click="kaydet" class="w-full mt-5 px-6 py-2.5 bg-primary text-white font-bold rounded-xl text-sm hover:opacity-90 transition">Şifreyi Kaydet</button>
        <p id="dHata" class="hidden text-xs text-error font-bold mt-3 text-center"></p>
      </div>
      <div id="sonucAlan" class="hidden text-center">
        <span class="material-symbols-outlined text-5xl text-green-600 block mb-2">check_circle</span>
        <p class="text-sm text-slate-600 mb-4">Şifreniz belirlendi. Şimdi giriş yapabilirsiniz.</p>
        <a id="dGirisLink" href="portal-giris.html" class="inline-block px-6 py-2.5 bg-primary text-white font-bold rounded-xl text-sm hover:opacity-90 transition">Girişe Git</a>
      </div>
    </div>
  </div>
</main>
<script src="js/eylem.js"></script>
<script src="js/belge.js"></script>
<script src="js/app.js"></script>
<script src="js/s-portal-davet-kabul.js"></script>
</body>
</html>
