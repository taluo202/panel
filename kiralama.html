<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link rel="icon" type="image/svg+xml" href="img/logo.svg"/>
<title>Kataloglar</title>
<link rel="stylesheet" href="css/tailwind.css"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
  .material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
  body{font-family:'Inter',sans-serif} h1,h2,h3{font-family:'Manrope',sans-serif}
  ::-webkit-scrollbar{width:4px} ::-webkit-scrollbar-thumb{background:#d5e3fc;border-radius:4px}
  .kat-btn.aktif{background:#00236f!important;color:#fff!important;font-weight:700;}
  .urun-kart img{transition:transform .2s;} .urun-kart:hover img{transform:scale(1.04);}
  @media (max-width: 767px) {
    aside { transform: translateX(-100%); transition: transform 0.28s cubic-bezier(0.4,0,0.2,1); z-index: 50; }
    aside.sidebar-open { transform: translateX(0); }
    main { margin-left: 0 !important; }
  }
</style>
</head>
<body class="bg-surface text-on-surface antialiased">

<div id="katalogModal" class="hidden fixed inset-0 z-[200] bg-black/40 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-2xl w-full pencere p-7">
    <h2 class="text-lg font-bold font-headline mb-5">Katalog Yükle</h2>
    <div class="space-y-4">
      <div class="space-y-1">
        <label class="text-[11px] font-bold text-slate-500 uppercase tracking-wider block">Kategori</label>
        <input id="kKategori" readonly class="w-full bg-surface-container-low border-none rounded-xl px-4 py-2.5 text-sm outline-none text-slate-500"/>
      </div>
      <div class="space-y-1">
        <label class="text-[11px] font-bold text-slate-500 uppercase tracking-wider block">Katalog Adı *</label>
        <input id="kAd" class="w-full bg-surface-container-low border-none rounded-xl px-4 py-2.5 text-sm outline-none focus:ring-2 focus:ring-primary/30" placeholder="Örn: Genel Katalog 2025"/>
      </div>
      <div class="space-y-1">
        <label class="text-[11px] font-bold text-slate-500 uppercase tracking-wider block">Dosya (PDF / Resim)</label>
        <input id="kDosya" type="file" accept=".pdf,.jpg,.jpeg,.png,.webp" class="w-full text-sm text-slate-600 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-surface-container file:text-primary hover:file:opacity-80"/>
      </div>
    </div>
    <div class="flex gap-3 mt-6 justify-end">
      <button data-on-click="kapat" data-args='["katalogModal"]' class="px-5 py-2 text-slate-600 font-bold text-sm hover:bg-surface-container-low rounded-xl transition">Vazgeç</button>
      <button id="katalogYukleBtn" data-on-click="katalogYukle" class="px-6 py-2 bg-primary text-white font-bold rounded-xl text-sm hover:opacity-90 transition">Yükle</button>
    </div>
  </div>
</div>

<div id="urunModal" class="hidden fixed inset-0 z-[200] bg-black/40 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-2xl w-full pencere p-7 max-h-[90vh] overflow-y-auto">
    <h2 class="text-lg font-bold font-headline mb-5" id="urunModalBaslik">Ürün Ekle</h2>
    <div class="space-y-4">
      <div class="grid grid-cols-2 gap-3">
        <div class="col-span-2 space-y-1">
          <label class="text-[11px] font-bold text-slate-500 uppercase tracking-wider block">Ürün Adı *</label>
          <input id="uIsim" class="w-full bg-surface-container-low border-none rounded-xl px-4 py-2.5 text-sm outline-none focus:ring-2 focus:ring-primary/30" placeholder="Ürün adı…"/>
        </div>
        <div class="col-span-2 space-y-1">
          <label class="text-[11px] font-bold text-slate-500 uppercase tracking-wider block">Kategori *</label>
          <select id="uKategori" class="w-full bg-surface-container-low border-none rounded-xl px-4 py-2.5 text-sm outline-none focus:ring-2 focus:ring-primary/30">
            <option value="Akülü Makaslı Platformlar">Akülü Makaslı Platformlar</option>
            <option value="4X4 Arazi Tipi Akülü Makaslı Platformlar">4X4 Arazi Tipi Akülü Makaslı Platformlar</option>
            <option value="4x4 Arazi Tipi Dizel Makaslı Platformlar">4x4 Arazi Tipi Dizel Makaslı Platformlar</option>
            <option value="Arazi Tipi Paletli Akülü Makaslı Platform">Arazi Tipi Paletli Akülü Makaslı Platform</option>
            <option value="Akülü Eklemli Platformlar">Akülü Eklemli Platformlar</option>
            <option value="Akülü Teleskopik Platformlar">Akülü Teleskopik Platformlar</option>
            <option value="Dikey Direk Platformlar">Dikey Direk Platformlar</option>
            <option value="Dizel Forkliftler">Dizel Forkliftler</option>
            <option value="Elle Çekilebilir Makaslı Platformlar">Elle Çekilebilir Makaslı Platformlar</option>
            <option value="Çift Direk Dikey Platform">Çift Direk Dikey Platform</option>
            <option value="Örümcek Platformlar">Örümcek Platformlar</option>
            <option value="Araç Üstü Sepetli Platformlar">Araç Üstü Sepetli Platformlar</option>
            <option value="Araç Üstü Kırmalı Platformlar">Araç Üstü Kırmalı Platformlar</option>
            <option value="Araç Üstü Kırmasız Taşımalı Vinç">Araç Üstü Kırmasız Taşımalı Vinç</option>
            <option value="Araç Üstü Kırmalı Vinç">Araç Üstü Kırmalı Vinç</option>
          </select>
        </div>
        <div class="col-span-2 space-y-1">
          <label class="text-[11px] font-bold text-slate-500 uppercase tracking-wider block">Detay / Açıklama</label>
          <textarea id="uAciklama" rows="3" placeholder="Teknik özellikler, kapasite vb…" class="w-full bg-surface-container-low border-none rounded-xl px-4 py-2.5 text-sm outline-none focus:ring-2 focus:ring-primary/30 resize-none"></textarea>
        </div>
        <div class="col-span-2 space-y-1">
          <label class="text-[11px] font-bold text-slate-500 uppercase tracking-wider block">Görsel URL (Dış bağlantı)</label>
          <input id="uGorsel" type="url" placeholder="https://…" class="w-full bg-surface-container-low border-none rounded-xl px-4 py-2.5 text-sm outline-none focus:ring-2 focus:ring-primary/30 font-mono text-xs"/>
        </div>
        <div class="col-span-2 space-y-1">
          <label class="text-[11px] font-bold text-slate-500 uppercase tracking-wider block">Görsel Yükle (Dosyadan)</label>
          <div id="mevcutGorselWrap" class="hidden mb-2">
            <img id="mevcutGorsel" src="" alt="Mevcut görsel" class="h-20 rounded-xl object-contain bg-slate-50 border border-slate-100"/>
            <button data-on-click="gorselKaldir" class="mt-1 text-xs text-error font-semibold hover:underline flex items-center gap-1"><span class="material-symbols-outlined text-sm">delete</span>Görseli Kaldır</button>
          </div>
          <input id="uGorselDosya" type="file" accept=".jpg,.jpeg,.png,.webp" class="w-full text-sm text-slate-600 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-surface-container file:text-primary hover:file:opacity-80"/>
          <p class="text-[11px] text-slate-400 mt-1">Dosya yükleme, URL'yi geçersiz kılar.</p>
        </div>
        <div class="space-y-1">
          <label class="text-[11px] font-bold text-slate-500 uppercase tracking-wider block">Sıralama</label>
          <input id="uSira" type="number" min="0" value="0" class="w-full bg-surface-container-low border-none rounded-xl px-4 py-2.5 text-sm outline-none focus:ring-2 focus:ring-primary/30"/>
        </div>
      </div>
    </div>
    <div class="flex gap-3 mt-6 justify-end">
      <button data-on-click="kapat" data-args='["urunModal"]' class="px-5 py-2 text-slate-600 font-bold text-sm hover:bg-surface-container-low rounded-xl transition">Vazgeç</button>
      <button id="urunKaydetBtn" data-on-click="urunKaydet" class="px-6 py-2 bg-primary text-white font-bold rounded-xl text-sm hover:opacity-90 transition">Kaydet</button>
    </div>
  </div>
</div>

<div class="flex min-h-screen">

  <div id="kiralamaOverlay" style="display:none;position:fixed;inset:0;z-index:39;background:rgba(0,0,0,.45)" data-on-click="kiralamaCloseSidebar"></div>

  <aside class="fixed left-0 top-0 h-screen w-64 bg-white/90 backdrop-blur-2xl flex flex-col border-r border-slate-100 z-40">
    <div class="px-5 py-4 border-b border-slate-100 flex items-center gap-3">
      <a href="index.html" title="Dashboard"><img src="img/logo.svg" alt="" class="firma-logo h-10 w-auto"/></a>
    </div>
    <div class="px-4 py-2 border-b border-slate-100">
      <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Kataloglar</p>
    </div>
    <nav id="katNav" class="flex-1 overflow-y-auto py-2 px-3 space-y-0.5">
      <div class="text-slate-400 text-sm text-center py-6">Yükleniyor…</div>
    </nav>
    <div class="px-4 py-3 border-t border-slate-100">
      <a id="loginLink" href="login.html" class="hidden flex items-center gap-2 px-3 py-2 text-slate-500 hover:text-primary text-sm rounded-xl hover:bg-surface-container-low transition">
        <span class="material-symbols-outlined text-base">login</span> Admin Girişi
      </a>
      <a id="adminPanelLink" href="rapor.html" class="hidden flex items-center gap-2 px-3 py-2 text-slate-500 hover:text-primary text-sm rounded-xl hover:bg-surface-container-low transition">
        <span class="material-symbols-outlined text-base">dashboard</span> Yönetim Paneli
      </a>
    </div>
  </aside>

  <main class="md:ml-64 flex-1 min-h-screen">
    <header class="sticky top-0 z-30 bg-white/80 backdrop-blur-xl border-b border-slate-100 px-4 md:px-8 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <button data-on-click="kiralamaOpenSidebar" class="md:hidden p-2 rounded-xl hover:bg-surface-container-low text-slate-600">
          <span class="material-symbols-outlined">menu</span>
        </button>
        <div>
          <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Kataloglar</p>
          <h1 id="baslik" class="text-xl font-extrabold text-blue-950 font-headline">Kategori seçin</h1>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <a href="portal-giris.html" aria-label="Müşteri Girişi" class="px-3 py-2 text-slate-600 text-sm font-bold rounded-xl hover:bg-surface-container-low transition flex items-center gap-1.5">
          <span class="material-symbols-outlined text-base">login</span><span class="hidden sm:inline">Müşteri Girişi</span>
        </a>
        <div id="adminToolbar" class="hidden flex items-center gap-2">
          <button data-on-click="urunEkleModalAc" aria-label="Ürün Ekle" class="px-3 py-2 bg-surface-container-low text-slate-700 text-sm font-bold rounded-xl hover:bg-surface-container transition flex items-center gap-1.5">
            <span class="material-symbols-outlined text-base">add</span><span class="hidden sm:inline">Ürün Ekle</span>
          </button>
          <button data-on-click="katalogModalAc" aria-label="Katalog Ekle" class="px-3 py-2 bg-primary text-white text-sm font-bold rounded-xl hover:opacity-90 transition flex items-center gap-1.5">
            <span class="material-symbols-outlined text-base">upload_file</span><span class="hidden sm:inline">Katalog Ekle</span>
          </button>
        </div>
      </div>
    </header>

    <div class="p-4 md:p-8">
      <div id="katalogBolum" class="hidden mb-6"></div>
      <div id="urunGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-5">
        <div class="col-span-full text-center text-slate-400 py-20">Sol menüden kategori seçin.</div>
      </div>
    </div>
  </main>
</div>

<script src="js/eylem.js"></script>
<script src="js/s-kiralama.js"></script>
<script src="js/pwa.js"></script>
</body>
</html>
