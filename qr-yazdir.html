<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link rel="icon" type="image/svg+xml" href="img/logo.svg"/>
<title>Toplu QR Yazdırma — Kurumsal Panel</title>
<link rel="stylesheet" href="css/tailwind.css"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
  .material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
  body{font-family:'Inter',sans-serif} h1,h2,h3{font-family:'Manrope',sans-serif}
  .qr-card{break-inside:avoid;page-break-inside:avoid}
  @media print{
    aside,.no-print,header{display:none!important}
    main{margin:0!important}
    body{background:#fff!important}
    .qr-grid{grid-template-columns:repeat(3,1fr)!important;gap:8mm!important}
    .qr-card{border:1px dashed #ccc!important;box-shadow:none!important}
    @page{margin:12mm;size:A4}
  }
</style>
<link rel="stylesheet" href="css/belge.css"/>
</head>
<body class="bg-surface text-on-surface antialiased">
<aside id="sidebar" class="fixed left-0 top-0 h-screen w-64 bg-white/80 backdrop-blur-2xl flex flex-col py-6 px-4 z-50 border-r border-slate-100">
  <div class="mb-6 px-2"><a href="index.html" title="Dashboard"><img src="img/logo.svg" alt="" class="firma-logo h-12 w-auto"/></a></div>
  <nav class="flex-1 flex flex-col gap-0.5"></nav>
  <div class="pt-4 border-t border-slate-100">
    <button data-on-click="App.logout" class="w-full flex items-center gap-3 px-3 py-2.5 text-error hover:bg-error-container rounded-xl text-sm font-medium transition-all"><span class="material-symbols-outlined text-xl">logout</span><span>Çıkış Yap</span></button>
  </div>
</aside>

<main class="main-content md:ml-64 min-h-screen">
  <header class="no-print sticky top-0 z-40 bg-white/70 backdrop-blur-xl border-b border-slate-100 px-4 md:px-8 py-3 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <button id="hamburgerBtn" class="md:hidden p-2 rounded-xl hover:bg-surface-container-low text-slate-600"><span class="material-symbols-outlined">menu</span></button>
      <h1 class="text-base font-bold text-blue-950 font-headline">Toplu QR Etiket Yazdırma</h1>
    </div>
    <button data-on-click="App.sayfaYazdir" class="px-5 py-2 bg-primary text-white text-sm font-bold rounded-xl flex items-center gap-2 hover:opacity-90 transition">
      <span class="material-symbols-outlined text-lg">print</span> Yazdır
    </button>
  </header>

  <div class="p-4 md:p-8">
    <div class="no-print flex flex-wrap items-center gap-3 mb-6">
      <label class="flex items-center gap-2 text-sm font-semibold bg-white px-4 py-2 rounded-xl shadow-sm cursor-pointer"><input type="checkbox" id="chkArac" checked data-on-change="render"/> Araçlar</label>
      <label class="flex items-center gap-2 text-sm font-semibold bg-white px-4 py-2 rounded-xl shadow-sm cursor-pointer"><input type="checkbox" id="chkManlift" checked data-on-change="render"/> Makineler</label>
      <label class="flex items-center gap-2 text-sm font-semibold bg-white px-4 py-2 rounded-xl shadow-sm cursor-pointer"><input type="checkbox" id="chkPasif" data-on-change="render"/> Pasifleri de dahil et</label>
      <span class="text-xs text-slate-400 ml-auto" id="sayac"></span>
    </div>
    <div id="qrGrid" class="qr-grid grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-5">
      <p class="text-slate-400 text-sm">Yükleniyor…</p>
    </div>
  </div>
</main>

<script src="js/eylem.js"></script>
<script src="js/belge.js"></script>
<script src="js/app.js"></script>
<script src="js/app-panel.js"></script>
<script src="js/s-qr-yazdir.js"></script>
<script src="js/pwa.js"></script>
</body>
</html>
