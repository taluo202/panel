<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link rel="icon" type="image/svg+xml" href="img/logo.svg"/>
<title>Şifre Sıfırlama — Kurumsal Panel</title>
<link rel="stylesheet" href="css/tailwind.css"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
  body{font-family:'Inter',sans-serif}
  .material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
  .bg-pattern{background-image:radial-gradient(circle at 20% 50%,#dce1ff 0%,transparent 50%),radial-gradient(circle at 80% 20%,#b6c4ff 0%,transparent 40%)}
</style>
</head>
<body class="min-h-screen bg-surface bg-pattern flex items-center justify-center p-4">

<div class="w-full max-w-sm">
  <div class="text-center mb-8">
    <img src="img/logo.svg" alt="" class="firma-logo h-20 w-auto mx-auto mb-4 drop-shadow-xl"/>
    <h1 class="text-2xl font-extrabold text-on-surface font-headline">Şifre Sıfırlama</h1>
  </div>

  <div class="bg-white rounded-2xl shadow-xl p-8">

    <div id="talepAdim">
      <h2 class="text-lg font-bold text-on-surface font-headline mb-2">E-postanızı girin</h2>
      <p class="text-sm text-slate-500 mb-6">Hesabınıza kayıtlı e-posta adresine sıfırlama bağlantısı gönderelim.</p>
      <div id="talepMsg" class="hidden mb-4 p-3 rounded-xl text-sm font-medium"></div>
      <div class="space-y-1.5 mb-5">
        <label class="text-[11px] font-bold text-slate-500 uppercase tracking-wider block" for="email">E-posta</label>
        <input id="email" type="email" required
          class="w-full bg-surface-container-low border-none rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-primary/30 transition outline-none"
          placeholder="ornek@firma.com"/>
      </div>
      <button id="talepBtn" data-on-click="talepGonder" class="w-full py-3 bg-primary text-white font-bold rounded-xl text-sm shadow-sm hover:opacity-90 active:scale-95 transition flex items-center justify-center gap-2">
        <span class="material-symbols-outlined text-lg">mail</span> Sıfırlama Bağlantısı Gönder
      </button>
      <a href="login.html" class="giris-bag block text-center text-xs text-slate-400 hover:text-slate-600 mt-5 transition">← Giriş ekranına dön</a>
    </div>

    <div id="sifirlaAdim" class="hidden">
      <h2 class="text-lg font-bold text-on-surface font-headline mb-2">Yeni Şifre Belirleyin</h2>
      <p class="text-sm text-slate-500 mb-6">Hesabınız için yeni bir şifre girin.</p>
      <div id="sifirlaMsg" class="hidden mb-4 p-3 rounded-xl text-sm font-medium"></div>
      <div class="space-y-4 mb-5">
        <div class="space-y-1.5">
          <label class="text-[11px] font-bold text-slate-500 uppercase tracking-wider block">Yeni Şifre</label>
          <input id="yeniSifre" type="password" class="w-full bg-surface-container-low border-none rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-primary/30 outline-none transition" placeholder="En az 10 karakter; en az bir harf ve bir rakam"/>
          <p class="text-[11px] text-slate-400">En az 10 karakter; en az bir harf ve bir rakam. Kullanıcı adınızı içeremez.</p>
        </div>
        <div class="space-y-1.5">
          <label class="text-[11px] font-bold text-slate-500 uppercase tracking-wider block">Yeni Şifre (Tekrar)</label>
          <input id="yeniSifre2" type="password" class="w-full bg-surface-container-low border-none rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-primary/30 outline-none transition"/>
        </div>
      </div>
      <button id="sifirlaBtn" data-on-click="sifreYenile" class="w-full py-3 bg-primary text-white font-bold rounded-xl text-sm shadow-sm hover:opacity-90 active:scale-95 transition flex items-center justify-center gap-2">
        <span class="material-symbols-outlined text-lg">lock_reset</span> Şifreyi Güncelle
      </button>
      <a href="login.html" class="giris-bag block text-center text-xs text-slate-400 hover:text-slate-600 mt-5 transition">← Giriş ekranına dön</a>
    </div>

  </div>
</div>

<script src="js/eylem.js"></script>
<script src="js/s-sifre-sifirla.js"></script>
<script src="js/pwa.js"></script>
</body>
</html>
