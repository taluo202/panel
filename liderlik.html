<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link rel="icon" type="image/svg+xml" href="img/logo.svg"/>
<title>Liderlik Tablosu — Kurumsal Panel</title>
<link rel="stylesheet" href="css/tailwind.css"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
  .material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
  body{font-family:'Inter',sans-serif} h1,h2,h3{font-family:'Manrope',sans-serif}
  ::-webkit-scrollbar{width:4px} ::-webkit-scrollbar-thumb{background:#d5e3fc;border-radius:4px}
  .podyum{display:flex;align-items:flex-end;justify-content:center;gap:12px;margin-bottom:8px}
  .podyum-kart{border-radius:1rem;padding:16px 12px;text-align:center;color:#fff;position:relative}
  .podyum-1{background:linear-gradient(160deg,#f5c518,#c99400);min-height:150px;width:32%;order:2}
  .podyum-2{background:linear-gradient(160deg,#c7cdd6,#94a0ae);min-height:120px;width:30%;order:1}
  .podyum-3{background:linear-gradient(160deg,#e0a06a,#a86a35);min-height:100px;width:30%;order:3}
  .madalya{font-size:28px;line-height:1}
  @media print {
    aside, .no-print { display:none !important; }
    main { margin-left:0 !important; padding:0 !important; }
    body { background:white; height:auto !important; }
    header { position:static !important; box-shadow:none !important; border:none !important; background:white !important; }
    .podyum-kart { break-inside:avoid; page-break-inside:avoid; }
  }
</style>
<link rel="stylesheet" href="css/belge.css"/>
</head>
<body class="bg-surface text-on-surface antialiased">
<aside id="sidebar" class="fixed left-0 top-0 h-screen w-64 bg-white/80 backdrop-blur-2xl flex flex-col py-6 px-4 z-50 border-r border-slate-100">
  <div class="mb-6 px-2"><a href="index.html"><img src="img/logo.svg" alt="" class="firma-logo h-12 w-auto"/></a></div>
  <nav class="flex-1 flex flex-col gap-0.5 overflow-y-auto"></nav>
  <div class="pt-4 border-t border-slate-100">
    <button data-on-click="App.logout" class="w-full flex items-center gap-3 px-3 py-2.5 text-error hover:bg-error-container rounded-xl text-sm font-medium transition-all"><span class="material-symbols-outlined text-xl">logout</span><span>Çıkış Yap</span></button>
  </div>
</aside>

<main class="main-content md:ml-64 min-h-screen">
  <header class="sticky top-0 z-40 bg-white/70 backdrop-blur-xl border-b border-slate-100 px-4 md:px-8 py-3 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <button id="hamburgerBtn" class="md:hidden p-2 rounded-xl hover:bg-surface-container-low text-slate-600"><span class="material-symbols-outlined">menu</span></button>
      <h1 class="text-base font-bold text-blue-950 font-headline flex items-center gap-1.5"><span class="material-symbols-outlined text-primary">military_tech</span>Liderlik Tablosu</h1>
    </div>
    <div class="flex items-center gap-2 no-print">
      <div class="flex bg-white rounded-xl shadow-sm p-1" id="donemSecici">
        <button data-d="ay" class="ld-tab px-3 py-1.5 text-xs font-bold rounded-lg transition">Bu Ay</button>
        <button data-d="yil" class="ld-tab px-3 py-1.5 text-xs font-bold rounded-lg transition">Bu Yıl</button>
        <button data-d="tum" class="ld-tab px-3 py-1.5 text-xs font-bold rounded-lg transition">Tüm Zamanlar</button>
      </div>
      <button data-on-click="App.sayfaYazdir" title="Yazdır" class="px-3 py-2 text-primary hover:bg-primary/10 text-sm font-bold rounded-xl flex items-center gap-1.5 transition bg-white shadow-sm"><span class="material-symbols-outlined text-lg">print</span><span class="hidden sm:inline">Yazdır</span></button>
    </div>
  </header>

  <div class="p-4 md:p-8 max-w-4xl mx-auto space-y-8">
    <section>
      <h2 class="text-sm font-black text-slate-500 uppercase tracking-widest mb-4 flex items-center gap-2"><span class="material-symbols-outlined text-primary">engineering</span>En Çok Çalışan Operatörler</h2>
      <div id="opIcerik"><p class="text-slate-400 text-sm text-center py-8">Yükleniyor…</p></div>
    </section>

    <section>
      <h2 class="text-sm font-black text-slate-500 uppercase tracking-widest mb-4 flex items-center gap-2"><span class="material-symbols-outlined text-primary">payments</span>En Yüksek Ciro Yapan Temsilciler</h2>
      <div id="tmIcerik"><p class="text-slate-400 text-sm text-center py-8">Yükleniyor…</p></div>
    </section>
  </div>
</main>

<script src="js/eylem.js"></script>
<script src="js/belge.js"></script>
<script src="js/app.js"></script>
<script src="js/app-panel.js"></script>
<script src="js/s-liderlik.js"></script>
<script src="js/pwa.js"></script>
</body>
</html>
