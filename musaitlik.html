<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link rel="icon" type="image/svg+xml" href="img/logo.svg"/>
<title>Ekipman Müsaitlik Takvimi</title>
<link rel="stylesheet" href="css/tailwind.css"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
  .material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
  body{font-family:'Inter',sans-serif} h1,h2,h3{font-family:'Manrope',sans-serif}
  ::-webkit-scrollbar{width:8px;height:8px} ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px}
  .gx{overflow-x:auto;overflow-y:visible;-webkit-overflow-scrolling:touch}
  .lejant{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;border:1px solid transparent;background:none;font:inherit;color:inherit;cursor:pointer}
  .lejant:hover{background:#eff4ff}
  .lejant[aria-pressed="true"]{background:#e0e7ff;border-color:#1e3a8a;color:#0f172a;font-weight:700}
  .grow{display:flex;align-items:stretch;border-bottom:1px solid #eef2f9;width:max-content;min-width:100%}
  .glabel{position:sticky;left:0;z-index:5;background:#fff;width:270px;min-width:270px;max-width:270px;padding:4px 8px;border-right:2px solid #e2e8f0;display:flex;flex-direction:column;justify-content:center;gap:2px}
  .gl-ust{display:flex;align-items:center;gap:4px;min-width:0;height:20px}
  .gl-kod{display:flex;align-items:center;gap:3px;flex:none;font-size:11px;font-weight:800;color:#0f172a;text-decoration:none;white-space:nowrap}
  .gl-kod:hover{color:#173d70;text-decoration:underline}
  .gl-ust .gdurum{flex:0 1 auto;min-width:0}
  .gl-ust .material-symbols-outlined{font-size:16px;line-height:16px}
  .gl-kod{line-height:16px}
  .glabel .gl-ust > a.gl-ekle{position:relative;display:inline-flex;align-items:center;justify-content:center;
    width:20px;height:20px;min-width:20px;min-height:20px;flex:none;padding:0}
  .glabel .gl-ust > a.gl-ekle::after{content:"";position:absolute;inset:-10px -4px}
  .gl-metraj{font-size:10.5px;font-weight:800;color:#00236f;background:#e8eefc;border-radius:5px;padding:0 5px;line-height:16px;flex:none}
  .gl-bilgi{font-size:10px;line-height:13px;color:#475569;white-space:normal;overflow-wrap:anywhere}
  .gl-bilgi + .gl-bilgi{color:#64748b}
  .gl-dk{color:#b45309;font-weight:700}
  .gtrack{position:relative;height:44px;flex:none}
  .gsecim{position:absolute;top:2px;bottom:2px;background:rgba(22,163,74,.28);border:2px solid #16a34a;
          border-radius:6px;pointer-events:none;z-index:4}
  .gsecim-etiket{position:absolute;top:-2px;left:0;transform:translateY(-100%);white-space:nowrap;
          background:#16a34a;color:#fff;font-size:10px;font-weight:800;padding:2px 6px;border-radius:6px;z-index:6}
  .gtrack.secilebilir{cursor:crosshair}
  #secimMenu{position:fixed;z-index:70;min-width:236px;background:#fff;border:1px solid #e2e8f0;
          border-radius:14px;box-shadow:0 12px 40px rgba(15,23,42,.22);overflow:hidden;display:none}
  #secimMenu.acik{display:block}
  #secimMenu .sm-bas{padding:9px 12px;background:#f8fafc;border-bottom:1px solid #e2e8f0}
  #secimMenu .sm-ad{font-size:12px;font-weight:800;color:#0f172a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
  #secimMenu .sm-tar{font-size:11px;color:#64748b;margin-top:1px}
  #secimMenu button{display:flex;align-items:center;gap:9px;width:100%;padding:9px 12px;background:none;border:0;
          text-align:left;font-size:12.5px;font-weight:600;color:#334155;cursor:pointer}
  #secimMenu button:hover{background:#eff4ff;color:#00236f}
  #secimMenu button .material-symbols-outlined{font-size:18px}
  #secimMenu .sm-ayir{border-top:1px solid #f1f5f9}
  #secimOverlay{position:fixed;inset:0;z-index:69;display:none}
  #secimOverlay.acik{display:block}
  .gdurum{font-size:10px;font-weight:700;background-color:#f8fafc;border:1px solid #e2e8f0;border-radius:999px;field-sizing:content;
          padding:0 6px;cursor:pointer;outline:none;max-width:150px;flex:none;height:17px;line-height:15px}
  .gbar{position:absolute;border-radius:6px;display:flex;align-items:center;padding:0 7px;font-size:11px;font-weight:600;color:#fff;overflow:hidden;white-space:nowrap;cursor:default;box-shadow:0 1px 2px rgba(0,0,0,.18)}
  .gbar-kira{top:5px;height:22px}
  .gbar-zemin{position:absolute;top:3px;bottom:3px;border-radius:5px;opacity:.18;pointer-events:none;z-index:0}
  .gbar-zemin-yazi{position:absolute;top:50%;transform:translateY(-50%);font-size:9px;font-weight:800;
                   letter-spacing:.4px;text-transform:uppercase;opacity:.75;pointer-events:none;z-index:1}
  .gbar-servis{height:16px;font-size:10.5px}
  .ghead{position:sticky;top:0;z-index:6;background:#f8f9ff}
  .gcell{flex:none;text-align:center;font-size:10px;color:#64748b;border-right:1px solid #eef2f9;padding:4px 0;line-height:1.2}
  .gcell.we{background:#eef2f9}
  .gtoday{position:absolute;top:0;bottom:0;width:2px;background:#ba1a1a;z-index:1}
  .gbar{z-index:2}
  .seldDot{width:10px;height:10px;border-radius:3px;display:inline-block}
  @media (max-width:640px){
    .glabel{width:170px;min-width:170px;max-width:170px}
    .gl-ust{flex-wrap:wrap;height:38px;row-gap:2px;align-content:center}
    #takvim .glabel .gl-ust select.gdurum:not([type]){flex:0 1 auto;max-width:calc(100% - 30px);height:20px!important;min-height:20px!important;line-height:18px;font-weight:600;padding:0 24px 0 8px!important;background-position:right 4px center!important}
    #takvim .glabel .gl-ust > a.gl-kod{min-height:0!important;height:16px!important;padding:0!important;position:relative}
    #takvim .glabel .gl-ust > a.gl-kod::after{content:"";position:absolute;inset:-8px -4px}
    #filtreCubugu{row-gap:8px}
    #filtreCubugu > *{max-width:100%;min-width:0}
    #filtreCubugu select,#filtreCubugu input{max-width:100%;min-width:0;flex:1 1 auto}
    #filtreCubugu select{flex:1 1 calc(50% - 6px);max-width:none}
    #filtreCubugu #fAra{flex:1 1 100%;max-width:none}
    #aciklamaSatiri{row-gap:4px}
    #aciklamaSatiri > span{flex:0 0 auto}
  }
</style>
<link rel="stylesheet" href="css/filo-plan.css"/>
<link rel="stylesheet" href="css/belge.css"/>
</head>
<body class="bg-surface text-on-surface antialiased">
<aside id="sidebar" class="fixed left-0 top-0 h-screen w-64 bg-white/80 backdrop-blur-2xl flex flex-col py-6 px-4 z-50 border-r border-slate-100">
  <div class="mb-6 px-2"><a href="index.html"><img src="img/logo.svg" alt="" class="firma-logo h-12 w-auto"/></a></div>
  <nav class="flex-1 flex flex-col gap-0.5 overflow-y-auto"></nav>
  <div class="pt-4 border-t border-slate-100">
    <button data-on-click="App.logout" class="w-full flex items-center gap-3 px-3 py-2.5 text-error hover:bg-error-container rounded-xl text-sm font-medium transition-all"><span class="material-symbols-outlined text-xl">logout</span><span>Çıkış Yap</span></button>
  </div>
</aside>

<main class="main-content md:ml-64 min-h-screen">
  <header class="sticky top-0 z-40 bg-white/70 backdrop-blur-xl border-b border-slate-100 px-4 md:px-8 py-3 flex flex-wrap justify-between items-center gap-2">
    <div class="flex items-center gap-3">
      <button id="hamburgerBtn" class="md:hidden p-2 rounded-xl hover:bg-surface-container-low text-slate-600"><span class="material-symbols-outlined">menu</span></button>
      <h1 class="text-base font-bold text-blue-950 font-headline">Müsaitlik Takvimi</h1>
    </div>
  </header>

  <div id="fpGovde" class="p-3 md:p-6" aria-busy="true">
    <div class="fp-metrics" id="fpOzet" hidden></div>
    <p class="fp-status sr-gizli" id="fpDurum" role="status">Takvim yükleniyor…</p>
    <div id="filtreCubugu" class="bg-white rounded-xl shadow-sm p-3 mb-3 flex flex-wrap items-center gap-2">
      <button type="button" id="fpFiltreAc" data-on-click="filtreleriKatla" aria-expanded="false"
        class="md:hidden order-last px-3 py-1.5 rounded-xl bg-surface-container-low text-sm font-semibold text-slate-600 flex items-center gap-1">
        <span class="material-symbols-outlined text-base">tune</span><span id="fpFiltreEtiket">Filtreler</span>
      </button>
      <input id="fBas" aria-label="Takvim başlangıcı" type="date" data-on-change="yukle" class="bg-surface-container-low border-none rounded-xl px-3 py-1.5 text-sm outline-none focus:ring-2 focus:ring-primary/20"/>
      <select id="fGun" aria-label="Görünecek gün sayısı" data-on-change="yukle" class="bg-surface-container-low border-none rounded-xl px-3 py-1.5 text-sm outline-none focus:ring-2 focus:ring-primary/20">
        <option value="7">7 gün</option><option value="14">14 gün</option><option value="30" selected>30 gün</option><option value="60">60 gün</option><option value="90">90 gün</option><option value="120">120 gün</option>
      </select>
      <select id="fTur" data-ek aria-label="Makine türü" data-on-change="yukle" class="fp-ek bg-surface-container-low border-none rounded-xl px-3 py-1.5 text-sm outline-none focus:ring-2 focus:ring-primary/20">
        <option value="">Tüm Tipler</option><option value="manlift">Makine</option><option value="arac">Araç</option>
      </select>
      <select id="fSube" data-ek aria-label="Şube" data-on-change="yukle" class="fp-ek bg-surface-container-low border-none rounded-xl px-3 py-1.5 text-sm outline-none focus:ring-2 focus:ring-primary/20"><option value="">Tüm Şubeler</option></select>
      <select id="fMarka" data-ek aria-label="Marka" data-on-change="yukle" class="fp-ek bg-surface-container-low border-none rounded-xl px-3 py-1.5 text-sm outline-none focus:ring-2 focus:ring-primary/20"><option value="">Tüm Markalar</option></select>
      <select id="fKategori" data-ek aria-label="Makine kategorisi" data-on-change="yukle" class="fp-ek bg-surface-container-low border-none rounded-xl px-3 py-1.5 text-sm outline-none focus:ring-2 focus:ring-primary/20"><option value="">Tüm Kategoriler</option></select>
      <select id="fMetraj" data-ek aria-label="Metraj" data-on-change="yukle" class="fp-ek bg-surface-container-low border-none rounded-xl px-3 py-1.5 text-sm outline-none focus:ring-2 focus:ring-primary/20"><option value="">Tüm metrajlar</option></select>
      <select id="fDurum" data-ek aria-label="Operasyon durumu" data-on-change="render" class="fp-ek bg-surface-container-low border-none rounded-xl px-3 py-1.5 text-sm outline-none focus:ring-2 focus:ring-primary/20">
        <option value="">Tüm Durumlar</option><option value="bosta">Dönem boyunca müsait</option><option value="dolu">Dönemde kiralama var</option><option value="kiraya_gidecek">Kiraya Gidecek</option><option value="kiradan_gelecek">Kiradan Gelecek</option><option value="bakim_bekliyor">Bakım Bekliyor</option><option value="bakimda">Bakımda</option><option value="serviste">Serviste</option><option value="nakliyede">Teslimde / Nakliyede</option><option value="satildi">Satıldı</option><option value="pasif">Pasif</option>
      </select>
      <input data-sayfa-arama id="fAra" aria-label="Makine ara: kod, marka, model, seri no, stok kodu, metraj, şube, durum" type="text" placeholder="Makine ara (kod, marka, seri no, metraj…)" data-on-input="aramaDegisti" class="bg-surface-container-low border-none rounded-xl px-3 py-1.5 text-sm outline-none focus:ring-2 focus:ring-primary/20 flex-1 min-w-[19.5rem] max-w-md"/>
      <button type="button" data-on-click="filtreTemizle" class="fp-ek px-3 py-1.5 text-sm font-semibold text-slate-500 hover:text-primary hover:bg-surface-container-low rounded-xl transition">Temizle</button>
    </div>

    <section class="fp-search" aria-labelledby="fpAramaBaslik"><h3 id="fpAramaBaslik">Hangi tarihler için makine gerekiyor?</h3><div class="fp-search-controls"><label>Başlangıç<input id="bBas" type="date"/></label><label>İade günü (dâhil)<input id="bBit" type="date"/></label><button class="fp-btn fp-primary" type="button" data-on-click="bostaAra">Müsait makineleri bul</button><button class="fp-btn hidden" type="button" id="bTemizBtn" data-on-click="bostaTemizle">Tarih aramasını kaldır</button><span id="bSonuc" role="status"></span></div><p class="fp-explainer">Örnek: 7 Eylül başlangıç, 10 Eylül iade = 4 kira günü (iki uç da sayılır). Müsaitlik kaydetmeden önce tekrar kontrol edilir.</p></section>
    <div id="aciklamaSatiri" class="flex flex-wrap items-center gap-x-4 gap-y-1 mb-2 text-xs text-slate-500">
      <button type="button" class="lejant" data-lejant="musait" aria-pressed="false" data-on-click="lejantSec" data-args='["$this"]' title="Bu türü göster / gizle"><span class="seldDot" style="background:#16a34a"></span>Müsait (boş)</button>
      <button type="button" class="lejant" data-lejant="kiralama" aria-pressed="false" data-on-click="lejantSec" data-args='["$this"]' title="Bu türü göster / gizle"><span class="seldDot" style="background:#1e3a8a"></span>Kiralama</button>
      <button type="button" class="lejant" data-lejant="tamamlanan" aria-pressed="false" data-on-click="lejantSec" data-args='["$this"]' title="Bu türü göster / gizle"><span class="seldDot" style="background:#94a3b8"></span>Tamamlanan</button>
      <button type="button" class="lejant" data-lejant="acik" aria-pressed="false" data-on-click="lejantSec" data-args='["$this"]' title="Bu türü göster / gizle — bitişi olmayan ya da planlı iade günü geçtiği hâlde iade edilmemiş (kırmızı kesik kenarlıklı) kiralamalar; makine iade edilene kadar dolu sayılır"><span class="seldDot" style="background:#dbeafe;border:1px dashed #64748b"></span>Açık uçlu / iadesi geciken</button>
      <button type="button" class="lejant" data-lejant="bakim" aria-pressed="false" data-on-click="lejantSec" data-args='["$this"]' title="Bu türü göster / gizle"><span class="seldDot" style="background:#f59e0b"></span>Bakım</button>
      <button type="button" class="lejant" data-lejant="ariza" aria-pressed="false" data-on-click="lejantSec" data-args='["$this"]' title="Bu türü göster / gizle"><span class="seldDot" style="background:#b91c1c"></span>Arıza / servis</button>
      <button type="button" class="lejant" data-lejant="ekspertiz" aria-pressed="false" data-on-click="lejantSec" data-args='["$this"]' title="Bu türü göster / gizle"><span class="seldDot" style="background:#7c3aed"></span>Ekspertiz</button>
      <button type="button" class="lejant" data-lejant="kontrol" aria-pressed="false" data-on-click="lejantSec" data-args='["$this"]' title="Bu türü göster / gizle"><span class="seldDot" style="background:#0ea5e9;border-radius:2px"></span>Planlı kontrol</button>
      <button type="button" class="lejant" data-on-click="bugunuGoster" title="Takvimi bugüne kaydır"><span class="inline-block w-0.5 h-3" style="background:#ba1a1a"></span>Bugün</button>
      <span class="ml-auto font-semibold" id="ozet"></span>
    </div>

    <div class="fp-viewbar"><div class="fp-tools"><button id="fpTakvim" type="button" class="fp-btn" aria-pressed="true">Takvim</button><button id="fpKart" type="button" class="fp-btn" aria-pressed="false">Makine kartları</button><span id="fpAralik" class="fp-sub"></span></div><label class="fp-touch"><input id="fpSurukle" type="checkbox"/> Dokunarak tarih sürükleme</label></div>
    <div id="fpKartlar" class="fp-cards" hidden></div>
    <div id="takvimKutu" class="bg-white rounded-xl shadow-sm">
      <div id="cakismaUyari" class="hidden mx-3 mt-3 rounded-xl bg-error-container text-error px-3 py-2 text-[12px] font-semibold"></div>
      <div id="takvim" class="gx rounded-xl" tabindex="0" aria-label="Filo takvimi, yatay ve dikey kaydırılabilir"><div class="p-10 text-center text-slate-400">Yükleniyor…</div></div>
    </div>
  </div>

  <div id="secimOverlay" data-on-click="secimMenuKapat"></div>
  <div id="secimMenu" role="menu" aria-label="Seçilen tarih aralığı için işlemler">
    <div class="sm-bas">
      <div class="sm-ad" id="smAd"></div>
      <div class="sm-tar" id="smTarih"></div>
    </div>
    <button type="button" data-on-click="secimEylem" data-args='["kiralama"]'><span class="material-symbols-outlined" style="color:#1e3a8a">event_available</span>Kiralama Aç</button>
    <button type="button" data-on-click="secimEylem" data-args='["bakim"]'><span class="material-symbols-outlined" style="color:#0891b2">build</span>Bakıma Al</button>
    <button type="button" data-on-click="secimEylem" data-args='["ariza"]'><span class="material-symbols-outlined" style="color:#dc2626">warning</span>Arıza / Servis Kaydı</button>
    <button type="button" data-on-click="secimEylem" data-args='["expertiz"]'><span class="material-symbols-outlined" style="color:#7c3aed">fact_check</span>Ekspertiz / Kontrol</button>
    <button type="button" class="sm-ayir" data-on-click="secimMenuKapat"><span class="material-symbols-outlined" style="color:#94a3b8">close</span>Vazgeç</button>
  </div>
</main>

<script src="js/eylem.js"></script>
<script src="js/belge.js"></script>
<script src="js/app.js"></script>
<script src="js/app-panel.js"></script>
<script src="js/filo-model.js"></script>
<script src="js/filo-plan.js"></script>
<script src="js/s-musaitlik.js"></script>
<script src="js/pwa.js"></script>
</body>
</html>
